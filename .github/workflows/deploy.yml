name: Production CI/CD

on:
  push:
    branches:
      - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: |
          cd server
          npm ci

      - name: Build frontend
        run: |
          cd client
          npm ci
          npm run build

      - name: Verify pipeline
        run: echo "Production CI pipeline completed successfully!"
